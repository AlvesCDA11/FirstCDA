<!DOCTYPE html>
<!-- lang : langue de la page, utilisee par les lecteurs d'ecran et les moteurs de recherche. -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Sans cette balise, le mobile affiche la page en version desktop dezoomee. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Titre unique par page : "Nom de la page - Nom du site". C'est ce qui
       s'affiche dans l'onglet, l'historique et les resultats de recherche. -->
  <title>Nom de la page - TechCorp RH</title>
  <meta name="description" content="Une phrase qui resume le contenu de la page.">

  <!-- Application interne : pas d'indexation par les moteurs de recherche. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/main.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Titre de la page</h1>

    <div class="container">
      <div class="box--primary"></div>
      <div class="box--secondary"></div>
      <div class="box--focus"></div>
    </div>

    <div class="box--text">
      <p class="text--xxl">Hello world</p>
      <p class="text--xl">Hello world</p>
      <p class="text--lg">Hello world</p>
      <p class="text--base">Hello world</p>
    </div>

    <div class="boxSpace">
      <div class="space space--one"></div>
      <div class="space space--two"></div>
      <div class="space space--three"></div>
      <div class="space space--four"></div>
    </div>

    <div class="boxBtn">
      <button class="btn btn--one">Contact</button>
      <button class="btn btn--two"> Contact</button>
    </div>

    <div class="boxState">
      <div class="state state--success">
        <p>hello world</p>
      </div>
      <div class="state state--warning">
        <p>hello world</p>
      </div>
      <div class="state state--danger">
        <p>hello world</p>
      </div>
    </div>
  </main>
</body>
</html>

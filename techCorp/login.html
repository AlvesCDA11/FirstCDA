<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/main.css">
    <title>Login</title>
</head>
<body>
    <main class="container--principal--login">
        <div class="box--info--login">
            <p class="text--principal-white">TechCorp</p>
        </div>
        <form action="">
            <h1>Connexion</h1>
            <input type="email" placeholder="exemple@mail.com" class="input--form" required>
            <input type="password" placeholder="Mot de passe" class="input--form" required>
            <input type="submit" value="Se connecter" class="btn btn--one">
            <p>Mot de passe oublié ?<a href="">Reinitialiser</a></p>
        </form>
    </main>
</body>
</html>
